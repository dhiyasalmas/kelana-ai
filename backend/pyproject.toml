[project]
name = "kelana-ai-backend"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "fastapi[standard]==0.115.12",
    "uvicorn==0.32.1",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.0.0",
    "boto3==1.43.56",
    "bcrypt==4.2.1",
    "python-jose[cryptography]==3.3.0",
    "cryptography==44.0.3",
    "pydantic==2.13.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Ini adalah FastAPI app, bukan library — tidak ada package yang perlu di-install
where = ["."]
include = []

[tool.fastapi]
entrypoint = "main:app"
